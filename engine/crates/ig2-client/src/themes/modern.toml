button_transparency = [0, 0]
text = [219, 230, 245]
text_dim = [128, 148, 173]
text_off = [77, 84, 97]
accent = [102, 199, 255]
hover = [255, 219, 115]
track_on = [41, 128, 191]
track_off = [46, 51, 64]
knob = [230, 240, 255]
