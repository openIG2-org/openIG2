# The look this mod switches on (docs/decisions/0088-remaster-as-mods.md).
[lighting]
anti_aliasing = true
per_pixel = true
soft_shadows = true
bloom = true
hdr = true
bloom_threshold = 0.8
bloom_strength = 0.6

[effects]
battle = true
smooth_glows = true

[starmap]
atmosphere = 0.6
atmosphere_size = 1.35
atmosphere_color = "#7fb2ff"
