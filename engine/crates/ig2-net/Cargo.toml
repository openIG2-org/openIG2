[package]
name = "ig2-net"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ig2-sim = { version = "0.1.0", path = "../ig2-sim", features = ["serde"] }
getrandom = "0.3"
miniz_oxide = "0.8"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "ring"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror.workspace = true
# std::time natively; the page's clock in the browser, where std's panics (ADR 0047).
web-time = "1.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "io-util", "time"], optional = true }
igd-next = { version = "0.17.1", default-features = false, optional = true }
spake2 = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
socket2 = "0.6"
# The WebRTC transport's native side (ADR 0047 part 4), pure-Rust crypto.
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"], optional = true }

# The browser build (ADR 0047): the page's crypto.getRandomValues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# spake2's rand_core 0.6 still asks the older one.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
# The page's RTCPeerConnection and fetch (webrtc::connect).
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "MessageEvent", "RtcPeerConnection", "RtcDataChannel", "RtcDataChannelState", "RtcDataChannelType", "RtcIceGatheringState", "RtcSdpType", "RtcSessionDescription", "RtcSessionDescriptionInit", "Request", "RequestInit", "Response"] }

[dev-dependencies]
ig2-formats = { version = "0.1.0", path = "../ig2-formats" }
ig2-rules = { version = "0.1.0", path = "../ig2-rules" }

[features]
# The QUIC transport (ADR 0005 §2, ADR 0007 §6).
quic = ["dep:quinn", "dep:rustls", "dep:rcgen", "dep:tokio"]
# The WebRTC transport for browser joiners (ADR 0047 part 4).
webrtc = ["dep:str0m"]
# UPnP IGD port mapping (ADR 0008 §2).
upnp = ["dep:igd-next"]
