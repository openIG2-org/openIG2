name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tests that need the game's files skip without an install.
env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: No game data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 -I tools/check_tree.py --base "origin/${{ github.base_ref }}"
          else
            python3 -I tools/check_tree.py
          fi

  windows:
    name: Windows build, tests, clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Version
        shell: bash
        run: echo "OPENIG2_VERSION=$(python -I tools/release/version.py)" >> "$GITHUB_ENV"
      - name: Build
        working-directory: engine
        run: cargo build --release --workspace
      - name: Test
        working-directory: engine
        run: cargo test --release --workspace
      - name: Clippy
        working-directory: engine
        run: cargo clippy --release --all-targets -- -D warnings

  wasm:
    name: Browser target check
    # The crates a browser build needs first (ADR 0047).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Clippy for wasm32
        working-directory: engine
        run: cargo clippy --target wasm32-unknown-unknown -p ig2-formats -p ig2-rules -p ig2-sim -- -D warnings

  linux:
    name: Linux build, tests, clippy
    # The oldest supported glibc (2.35): what the release archive is built on.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Version
        run: echo "OPENIG2_VERSION=$(python3 -I tools/release/version.py)" >> "$GITHUB_ENV"
      - name: Build
        working-directory: engine
        run: cargo build --release --workspace
      - name: Test
        working-directory: engine
        run: cargo test --release --workspace
      - name: Clippy
        working-directory: engine
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Release bundle
        run: python3 -I tools/release/build_unix.py --out dist

  macos:
    name: macOS build, tests, clippy
    # Apple Silicon (arm64): what the release archive is built on.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Version
        run: echo "OPENIG2_VERSION=$(python3 -I tools/release/version.py)" >> "$GITHUB_ENV"
      - name: Build
        working-directory: engine
        run: cargo build --release --workspace
      - name: Test
        working-directory: engine
        run: cargo test --release --workspace
      - name: Clippy
        working-directory: engine
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Release bundle
        run: python3 -I tools/release/build_unix.py --out dist
