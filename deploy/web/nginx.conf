server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The page and the module change with each image: revalidate them.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # The game files of the mounted folder (ADR 0081); the page copies them into the browser once.
    location /game/ {
        alias /srv/game/;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /game/index.json {
        alias /tmp/game-index.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types application/wasm text/javascript application/javascript application/json;
}
