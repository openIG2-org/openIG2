[package]
name = "ig2-client"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ab_glyph = "0.2.32"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.16"
ig2-formats = { version = "0.1.0", path = "../ig2-formats" }
ig2-net = { version = "0.1.0", path = "../ig2-net" }
ig2-rules = { version = "0.1.0", path = "../ig2-rules" }
ig2-sim = { version = "0.1.0", path = "../ig2-sim", features = ["serde"] }
lewton = "0.10"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["aac"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse"] }
# std::time natively; the page's clock in the browser, where std's panics (ADR 0047).
web-time = "1.1"
wgpu = "25.0.2"
winit = "0.30.13"
xbrz-rs = "0.1.0"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6.1", default-features = false }
ig2-net = { version = "0.1.0", path = "../ig2-net", features = ["quic", "upnp"] }
openh264 = "0.9.9"
pollster = "1.0.1"

# The browser build (ADR 0047).
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
# WebGL2 where the browser has no WebGPU (ADR 0047 §4).
wgpu = { version = "25.0.2", features = ["webgl"] }
cpal = { version = "0.16", features = ["wasm-bindgen"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemGetDirectoryOptions", "FileSystemGetFileOptions", "StorageManager", "Navigator", "Blob", "File", "console"] }
