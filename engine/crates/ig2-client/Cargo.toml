[package]
name = "ig2-client"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ab_glyph = "0.2.32"
bytemuck.workspace = true
cpal = "0.16"
# The remake's own designed pages (ADR 0062).
egui = { version = "0.32.3", default-features = false, features = ["default_fonts"] }
egui-wgpu = "0.32.3"
ig2-formats = { version = "0.1.0", path = "../ig2-formats" }
ig2-net = { version = "0.1.0", path = "../ig2-net" }
ig2-rules = { version = "0.1.0", path = "../ig2-rules" }
ig2-sim = { version = "0.1.0", path = "../ig2-sim", features = ["serde"] }
lewton.workspace = true
# The mod repository's signed index (ADR 0086 §1.2).
minisign-verify = "0.2"
png.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
symphonia = { version = "0.6.1", default-features = false, features = ["aac"] }
# The kit's icon files rasterised with round joins and caps (ADR 0073).
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
toml_edit.workspace = true
# std::time natively; the page's clock in the browser, where std's panics (ADR 0047).
web-time.workspace = true
wgpu.workspace = true
winit = "0.30.13"
xbrz-rs = "0.1.0"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6.1", default-features = false }
ig2-net = { version = "0.1.0", path = "../ig2-net", features = ["quic", "upnp", "webrtc"] }
openh264.workspace = true
pollster.workspace = true
# The mod repository's downloads, HTTPS only (ADR 0086 §1.2).
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
zune-jpeg = "0.4"

# The browser build (ADR 0047).
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
# WebGL2 where the browser has no WebGPU (ADR 0047 §4).
wgpu = { workspace = true, features = ["webgl"] }
cpal = { version = "0.16", features = ["wasm-bindgen"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemGetDirectoryOptions", "FileSystemGetFileOptions", "StorageManager", "Navigator", "Blob", "File", "console"] }

[dev-dependencies]
# Signs the test indexes the mod repository's tests verify.
minisign = { version = "0.7", default-features = false }

[lints]
workspace = true
