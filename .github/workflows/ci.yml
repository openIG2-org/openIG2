name: CI

# Not on every push to main: on pull requests, by hand (Actions -> CI -> Run workflow) and as the first step of every
# release (release.yml), which publishes the bundles these jobs upload: what is released is what was tested.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tests that need the game's files skip without an install.
env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: No game data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 -I tools/check_tree.py --base "origin/${{ github.base_ref }}"
          else
            python3 -I tools/check_tree.py
          fi

  windows:
    name: Windows tests, clippy, bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: clippy
      # The release's version and static-runtime flags for every step, so the tests, clippy and the bundle share one
      # build. Before the cache step: its key covers the flags.
      - name: Release build settings
        shell: bash
        run: python -I tools/release/build_windows.py --env >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Test
        working-directory: engine
        run: cargo test --release --workspace --locked
      - name: Clippy
        working-directory: engine
        run: cargo clippy --release --all-targets --locked -- -D warnings
      - name: Release bundle
        shell: bash
        run: python -I tools/release/build_windows.py --out dist --target engine/target
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  wasm:
    name: Browser target check
    # The browser build (ADR 0047): the shared crates, the network crate and the client.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Clippy for wasm32
        working-directory: engine
        run: cargo clippy --locked --target wasm32-unknown-unknown -p ig2-formats -p ig2-rules -p ig2-sim -p ig2-net -p ig2-client -- -D warnings

  linux:
    name: Linux tests, clippy, bundle
    # The oldest supported glibc (2.35): what the release archive is built on.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Version
        run: echo "OPENIG2_VERSION=$(python3 -I tools/release/version.py)" >> "$GITHUB_ENV"
      - name: Test
        working-directory: engine
        run: cargo test --release --workspace --locked
      - name: Clippy
        working-directory: engine
        run: cargo clippy --release --all-targets --locked -- -D warnings
      - name: Release bundle
        run: python3 -I tools/release/build_unix.py --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-linux
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS tests, clippy, bundle
    # Apple Silicon (arm64): what the release archive is built on.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Version
        run: echo "OPENIG2_VERSION=$(python3 -I tools/release/version.py)" >> "$GITHUB_ENV"
      - name: Test
        working-directory: engine
        run: cargo test --release --workspace --locked
      - name: Clippy
        working-directory: engine
        run: cargo clippy --release --all-targets --locked -- -D warnings
      - name: Release bundle
        run: python3 -I tools/release/build_unix.py --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-macos
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
