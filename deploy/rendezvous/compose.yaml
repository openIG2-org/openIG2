# Runs the rendezvous and relay service (docs/RENDEZVOUS.md). From a clone of the repository, building the image:
#   docker compose -f deploy/rendezvous/compose.yaml up -d --build
# Or with the published image, this file alone:
#   docker compose -f compose.yaml pull && docker compose -f compose.yaml up -d
# It needs the port open in the server's firewall for UDP and TCP; nothing is stored, so there are no volumes.
services:
  rendezvous:
    build:
      context: ../..
      dockerfile: deploy/rendezvous/Dockerfile
    image: ghcr.io/openig2-org/openig2-rendezvous:latest
    restart: unless-stopped
    # The binary installs no signal handlers; as PID 1 it would ignore `docker stop`'s SIGTERM.
    init: true
    ports:
      # Published ports keep the players' source addresses, which the hole punch needs. If a host firewall or
      # proxy rewrites them, use `network_mode: host` instead (and drop `ports`).
      - "${IG2_RENDEZVOUS_PORT:-29172}:29172/udp"
      # The same number over TCP: browser players' WebRTC signalling (plain HTTP).
      - "${IG2_RENDEZVOUS_PORT:-29172}:29172/tcp"
    # The limits are the service's flags (docs/RENDEZVOUS.md); add any of them here.
    command: ["--listen", "0.0.0.0:29172"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
