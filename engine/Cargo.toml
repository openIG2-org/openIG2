[workspace]
resolver = "3"
members = ["crates/ig2-formats", "crates/ig2-net", "crates/ig2-rules", "crates/ig2-sim", "crates/ig2-viewer", "crates/ig2-client", "crates/ig2-screendiff", "crates/ig2-check", "crates/ig2-rendezvous"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/openIG2-org/openIG2"
rust-version = "1.85"

[workspace.dependencies]
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
encoding_rs = "0.8"
thiserror = "2"
toml_edit = { version = "0.25.17", default-features = false, features = ["parse"] }
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wgpu = "25.0.2"
png = "0.18.1"
openh264 = "0.9.9"
lewton = "0.10"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
web-time = "1.1"
miniz_oxide = "0.8"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[profile.dev.package."*"]
opt-level = 2

# OpenH264 with H.264 9.2.2.1 CAVLC level_prefix >= 16 (High profile); see vendor/README.md.
[patch.crates-io]
openh264-sys2 = { path = "vendor/openh264-sys2" }
