[workspace]
resolver = "3"
members = ["crates/ig2-formats", "crates/ig2-rules", "crates/ig2-sim", "crates/ig2-viewer"]

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.85"

[workspace.dependencies]
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
encoding_rs = "0.8"
thiserror = "2"

[profile.dev.package."*"]
opt-level = 2
