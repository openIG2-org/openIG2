name: Release

# Beta: run by hand (Actions -> Release -> Run workflow) -> release vMAJOR.MINOR.N named "(beta)", marked Latest.
# Stable: push a tag vMAJOR.MINOR.N that matches tools/release/version.py -> the same, without "(beta)".
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  windows:
    name: Windows zip
    # No release from a commit that fails the build, the tests, clippy or the asset guard.
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
      - name: Version
        id: v
        shell: bash
        run: |
          v=$(python -I tools/release/version.py)
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$v" ]; then
            echo "tag ${{ github.ref_name }} does not match the computed version v$v" >&2; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "OPENIG2_VERSION=$v" >> "$GITHUB_ENV"
      - name: MinGW g++ with static libraries
        shell: bash
        run: g++ --version && g++ -print-file-name=libstdc++.a
      - name: Build the zip
        shell: bash
        run: python -I tools/release/build_windows.py --out dist
      - name: Release notes
        shell: bash
        run: |
          minor=$(cut -d. -f1,2 <<< "${{ steps.v.outputs.version }}")
          awk -v h="## $minor" 'index($0, h) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\nNeeds your own copy of Imperium Galactica II (GOG). Unzip into the game folder and run `openIG2.exe`.\n' >> notes.md
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: openIG2 ${{ steps.v.outputs.version }}${{ github.ref_type != 'tag' && ' (beta)' || '' }}
          prerelease: false
          make_latest: true
          body_path: notes.md
          files: dist/openig2-${{ steps.v.outputs.version }}-windows-x64.zip

  linux:
    name: Linux archive
    # After the Windows job: that one creates the release, this one adds its archive.
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Version
        id: v
        run: |
          v=$(python3 -I tools/release/version.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "OPENIG2_VERSION=$v" >> "$GITHUB_ENV"
      - name: Build the archive
        run: python3 -I tools/release/build_unix.py --out dist
      # Upload only: updating the existing release is refused (the v* tag rules), so no release action here.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.v.outputs.version }}" "dist/openig2-${{ steps.v.outputs.version }}-linux-x64.tar.gz" --clobber

  macos:
    name: macOS archive
    # After the Windows job: that one creates the release, this one adds its archive (unsigned).
    needs: windows
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Version
        id: v
        run: |
          v=$(python3 -I tools/release/version.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "OPENIG2_VERSION=$v" >> "$GITHUB_ENV"
      - name: Build the archive
        run: python3 -I tools/release/build_unix.py --out dist
      # Upload only: updating the existing release is refused (the v* tag rules), so no release action here.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.v.outputs.version }}" "dist/openig2-${{ steps.v.outputs.version }}-macos-arm64.tar.gz" --clobber
