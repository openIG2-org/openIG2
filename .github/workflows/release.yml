name: Release

# Beta: run by hand (Actions -> Release -> Run workflow) -> release vMAJOR.MINOR.N named "(beta)", marked Latest.
# Stable: push a tag vMAJOR.MINOR.N that matches tools/release/version.py -> the same, without "(beta)".
# The archives are the ones CI built and tested in this run; the browser image is built beside CI and becomes
# `latest` only once the release is out.
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

# One release at a time; a second one waits.
concurrency:
  group: release
  cancel-in-progress: false

env:
  WEB_IMAGE: ghcr.io/openig2-org/openig2-web

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  web-image:
    name: Browser image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: echo "version=$(python3 -I tools/release/version.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ steps.v.outputs.version }}
          build-args: OPENIG2_VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  publish:
    name: Publish the release
    # No release from a commit that fails the tests, clippy or the asset guard.
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          v=$(python3 -I tools/release/version.py)
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$v" ]; then
            echo "tag ${{ github.ref_name }} does not match the computed version v$v" >&2; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          ls -l dist
          minor=$(cut -d. -f1,2 <<< "${{ steps.v.outputs.version }}")
          awk -v h="## $minor" 'index($0, h) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\nNeeds your own copy of Imperium Galactica II (GOG). Unzip into the game folder and run `openIG2.exe`.\n' >> notes.md
      # One action creates the release with every archive: a published release under a v* tag cannot be edited.
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: openIG2 ${{ steps.v.outputs.version }}${{ github.ref_type != 'tag' && ' (beta)' || '' }}
          prerelease: false
          make_latest: true
          body_path: notes.md
          fail_on_unmatched_files: true
          files: |
            dist/openig2-${{ steps.v.outputs.version }}-windows-x64.zip
            dist/openig2-${{ steps.v.outputs.version }}-linux-x64.tar.gz
            dist/openig2-${{ steps.v.outputs.version }}-macos-arm64.tar.gz

  web-latest:
    name: Browser image -> latest
    # Servers that follow `latest` (docs/BUILDING.md -> Web server) get the new page once the release is out.
    needs: [publish, web-image]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag as latest
        run: docker buildx imagetools create -t "$WEB_IMAGE:latest" "$WEB_IMAGE:${{ needs.web-image.outputs.version }}"
